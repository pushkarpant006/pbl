
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeBox | Process analysis</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      color: #1f2328;
      background: #f5f7fa;
      --blue: #1f6feb;
      --green: #1a7f37;
      --amber: #9a6700;
      --red: #cf222e;
      --border: #d8dee4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 800px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0 0 20px;
      padding: 20px;
    }
    h1, h2, h3 { margin: 0 0 14px; }
    h1 { font-size: 1.7rem; }
    h2 { font-size: 1.25rem; }
    h3 { font-size: 1rem; }
    p { line-height: 1.5; }
    .muted { color: #59636e; font-size: 0.9rem; }
    label { display: block; font-weight: 600; margin: 16px 0; }
    input[type="file"] { display: block; margin-top: 8px; max-width: 100%; }
    button {
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      padding: 10px 16px;
    }
    button.secondary { background: #eaeef2; color: #24292f; }
    button:disabled { cursor: wait; opacity: 0.65; }
    .main-button { display: block; font-size: 1.08rem; padding: 13px 20px; width: 100%; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .warning { margin-bottom: 0; }
    .error {
      border: 1px solid #ff8182;
      border-radius: 6px;
      background: #ffebe9;
      color: #82071e;
      margin: 0 0 20px;
      padding: 12px 16px;
      white-space: pre-wrap;
    }
    .status-line { align-items: center; display: flex; gap: 8px; margin-bottom: 14px; }
    .badge { border-radius: 999px; background: #ddf4ff; color: #0550ae; font-weight: 700; padding: 4px 10px; }
    .badge.finished { background: #dafbe1; color: var(--green); }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; margin: 8px 0 16px; width: 100%; }
    th, td { border-bottom: 1px solid var(--border); padding: 9px 10px; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; font-weight: 650; }
    tbody tr:nth-child(even) { background: #f6f8fa; }
    .state { align-items: center; display: inline-flex; gap: 7px; white-space: nowrap; }
    .dot { background: #8c959f; border-radius: 50%; height: 9px; width: 9px; }
    .dot.RUNNING { background: var(--green); }
    .dot.READY { background: var(--blue); }
    .dot.SUSPENDED { background: var(--amber); }
    .dot.TERMINATED { background: #8c959f; }
    .event-log {
      background: #f6f8fa;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      height: 180px;
      overflow: auto;
      padding: 10px;
    }
    .event-log p { font-size: 0.85rem; margin: 0 0 6px; overflow-wrap: anywhere; }
    .result-banner { border-left: 6px solid var(--green); }
    .result-banner.LOW { border-color: var(--green); }
    .result-banner.MEDIUM { border-color: var(--amber); }
    .result-banner.HIGH { border-color: var(--red); }
    .risk-score { font-size: 1.1rem; font-weight: 650; }
    .tile-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
    .tile { background: #f6f8fa; border-radius: 6px; padding: 14px; }
    .tile strong { display: block; font-size: 1.25rem; margin-top: 6px; }
    .section-title { margin-top: 8px; }
    .slice-bar-track { background: #eaeef2; border-radius: 3px; height: 12px; min-width: 90px; }
    .slice-bar { background: var(--blue); border-radius: 3px; height: 100%; min-width: 2px; }
    .db-note { color: #59636e; font-size: 0.85rem; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      body { padding: 16px 10px; }
      .card { padding: 15px; }
      .tile-grid { grid-template-columns: repeat(2, 1fr); }
      th, td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">SafeBox</h1>
      <form id="analyze-form">
        <label for="program-file">Program file</label>
        <input id="program-file" name="file" type="file" required>
        <div class="button-row">
          <label>Quantum (ms)
            <input name="quantum" type="number" min="50" max="1000" value="200">
          </label>
          <label>Timeout (seconds)
            <input name="timeout" type="number" min="1" max="60" value="15">
          </label>
        </div>
        <button id="run-button" class="main-button" type="submit">Run &amp; Analyze</button>
      </form>
      <p class="muted warning">This program runs directly on this machine. Upload only programs you trust.</p>
    </section>

    <div id="error-box" class="error" role="alert" hidden></div>

    <section id="live-card" class="card" aria-labelledby="live-title" hidden>
      <h2 id="live-title">Live analysis</h2>
      <div class="status-line">
        <span id="status-badge" class="badge">Running</span>
        <span id="live-message" class="muted">Waiting for process events...</span>
      </div>
      <h3>Processes</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>PID</th><th>Parent</th><th>Name</th><th>State</th></tr></thead>
          <tbody id="live-processes"></tbody>
        </table>
      </div>
      <h3>Event log</h3>
      <div id="event-log" class="event-log" role="log" aria-live="polite"></div>
    </section>

    <section id="analysis-results" hidden></section>
  </main>

  <script>
    "use strict";

    const processRows = new Map();
    const analyzeForm = document.getElementById("analyze-form");
    const runButton = document.getElementById("run-button");
    const liveCard = document.getElementById("live-card");
    const resultContainer = document.getElementById("analysis-results");
    const errorBox = document.getElementById("error-box");

    function makeTextElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = String(text);
      if (className) element.className = className;
      return element;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function setRunning(isRunning) {
      runButton.disabled = isRunning;
      runButton.textContent = isRunning ? "Analyzing..." : "Run & Analyze";
    }

    function addLogLine(message, timeMs) {
      const line = makeTextElement("p", `${timeMs ?? 0} ms  ${message}`);
      const log = document.getElementById("event-log");
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    function renderStateCell(state) {
      const wrapper = document.createElement("span");
      wrapper.className = "state";
      const dot = makeTextElement("span", "", `dot ${state}`);
      dot.setAttribute("aria-hidden", "true");
      wrapper.appendChild(dot);
      wrapper.appendChild(makeTextElement("span", state));
      return wrapper;
    }

    function updateLiveProcess(process) {
      let row = processRows.get(process.pid);
      if (!row) {
        row = document.createElement("tr");
        processRows.set(process.pid, row);
        document.getElementById("live-processes").appendChild(row);
      }
      row.textContent = "";
      row.appendChild(makeTextElement("td", process.pid));
      row.appendChild(makeTextElement("td", process.parent_pid));
      row.appendChild(makeTextElement("td", process.name));
      const stateCell = document.createElement("td");
      stateCell.appendChild(renderStateCell(process.state || "READY"));
      row.appendChild(stateCell);
    }

    function handleAnalyzerEvent(event) {
      if (event.type === "process_added") {
        updateLiveProcess({ ...event, state: "READY" });
        addLogLine(`+ process ${event.pid} added (child of ${event.parent_pid})`, event.time_ms);
      } else if (event.type === "state_changed") {
        const previous = processRows.get(event.pid);
        if (previous) {
          const cells = previous.children;
          const rowData = {
            pid: event.pid,
            parent_pid: cells[1].textContent,
            name: cells[2].textContent,
            state: event.to
          };
          updateLiveProcess(rowData);
        }
        addLogLine(`${event.pid} is now ${event.to}`, event.time_ms);
      } else if (event.type === "process_exited") {
        const previous = processRows.get(event.pid);
        if (previous) {
          updateLiveProcess({
            pid: event.pid,
            parent_pid: previous.children[1].textContent,
            name: previous.children[2].textContent,
            state: "TERMINATED"
          });
        }
        addLogLine(`Process ${event.pid} exited`, event.time_ms);
      } else if (event.type === "action") {
        const message = event.action === "PAUSE"
          ? `Paused ${event.pid}`
          : "Terminated process group";
        addLogLine(message, event.time_ms);
      } else if (event.type === "error") {
        throw new Error(event.error);
      }
    }

    function addTile(container, label, value) {
      const tile = makeTextElement("div", "", "tile");
      tile.appendChild(makeTextElement("span", label, "muted"));
      tile.appendChild(makeTextElement("strong", value));
      container.appendChild(tile);
    }

    function makeTable(headers, rows) {
      const wrapper = makeTextElement("div", "", "table-wrap");
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headerRow = document.createElement("tr");
      for (let index = 0; index < headers.length; index++) {
        headerRow.appendChild(makeTextElement("th", headers[index]));
      }
      head.appendChild(headerRow);
      table.appendChild(head);
      const body = document.createElement("tbody");
      for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
        const row = document.createElement("tr");
        for (let cellIndex = 0; cellIndex < rows[rowIndex].length; cellIndex++) {
          const cell = document.createElement("td");
          const value = rows[rowIndex][cellIndex];
          if (value instanceof Node) cell.appendChild(value);
          else cell.textContent = value === null || value === undefined ? "—" : String(value);
          row.appendChild(cell);
        }
        body.appendChild(row);
      }
      table.appendChild(body);
      wrapper.appendChild(table);
      return wrapper;
    }

    function renderFinalProcesses(processes) {
      const rows = [];
      for (let index = 0; index < processes.length; index++) {
        const process = processes[index];
        rows.push([
          process.pid,
          process.parent_pid,
          process.final_state || process.status,
          process.exit_status,
          process.cpu_ms ?? process.cpu_usage
        ]);
      }
      return makeTable(["PID", "Parent", "State", "Exit", "CPU ms"], rows);
    }

    function renderSlices(slices) {
      let largest = 1;
      for (let index = 0; index < slices.length; index++) {
        if (slices[index].cpu_ms > largest) largest = slices[index].cpu_ms;
      }
      const rows = [];
      for (let index = 0; index < slices.length; index++) {
        const slice = slices[index];
        const track = makeTextElement("div", "", "slice-bar-track");
        const bar = makeTextElement("div", "", "slice-bar");
        bar.style.width = `${Math.max(2, 100 * slice.cpu_ms / largest)}%`;
        track.appendChild(bar);
        rows.push([index + 1, slice.pid, slice.start_ms, slice.end_ms, slice.cpu_ms, track]);
      }
      return makeTable(["Slice", "PID", "Start ms", "End ms", "CPU ms", "CPU"], rows);
    }

    function metricText(value) {
      return Number.isFinite(Number(value)) ? `${Number(value).toFixed(1)} ms` : "—";
    }

    function renderAnalysis(result) {
      liveCard.hidden = true;
      resultContainer.hidden = false;
      resultContainer.textContent = "";
      const findings = result.findings || [];
      const banner = makeTextElement("section", "", `card result-banner ${result.threat_level}`);
      banner.appendChild(makeTextElement("h2", result.verdict || "Analysis complete"));
      banner.appendChild(makeTextElement("p",
        `Risk score: ${result.risk_score ?? 0} · Threat level: ${result.threat_level || "SAFE"}`,
        "risk-score"));
      resultContainer.appendChild(banner);

      const summary = result.summary || result;
      const tiles = makeTextElement("section", "", "card tile-grid");
      addTile(tiles, "Total time", `${summary.duration_ms ?? 0} ms`);
      addTile(tiles, "CPU time", `${summary.total_cpu_ms ?? 0} ms`);
      addTile(tiles, "CPU %", `${Number(summary.cpu_percent || 0).toFixed(2)}%`);
      addTile(tiles, "Processes", summary.process_count ?? (result.processes || []).length);
      resultContainer.appendChild(tiles);

      const processCard = makeTextElement("section", "", "card");
      processCard.appendChild(makeTextElement("h2", "Process management"));
      processCard.appendChild(renderFinalProcesses(result.processes || []));
      resultContainer.appendChild(processCard);

      const schedulerCard = makeTextElement("section", "", "card");
      schedulerCard.appendChild(makeTextElement("h2", "CPU scheduling"));
      schedulerCard.appendChild(renderSlices(result.slices || []));
      const metrics = result.scheduler_metrics || {};
      const averages = metrics.averages || {};
      schedulerCard.appendChild(makeTextElement("p",
        `Average waiting: ${metricText(averages.waiting_ms)} · ` +
        `turnaround: ${metricText(averages.turnaround_ms)} · ` +
        `response: ${metricText(averages.response_ms)} · ` +
        `context switches: ${metrics.context_switches ?? 0}`));
      resultContainer.appendChild(schedulerCard);

      if (result.db_error) {
        resultContainer.appendChild(makeTextElement("p",
          `Not saved to database: ${result.db_error}`, "db-note"));
      }
    }

    function resetRunView() {
      errorBox.hidden = true;
      errorBox.textContent = "";
      resultContainer.hidden = true;
      resultContainer.textContent = "";
      liveCard.hidden = false;
      processRows.clear();
      document.getElementById("live-processes").textContent = "";
      document.getElementById("event-log").textContent = "";
      const badge = document.getElementById("status-badge");
      badge.className = "badge";
      badge.textContent = "Running";
      document.getElementById("live-message").textContent = "Analyzing the real process tree...";
    }

    async function readAnalysisStream(response) {
      if (!response.ok) {
        const errorBody = await response.json();
        throw new Error(errorBody.error || `Request failed with status ${response.status}.`);
      }
      if (!response.body) throw new Error("This browser does not support streamed responses.");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let pending = "";
      let finalResult = null;
      while (true) {
        const chunk = await reader.read();
        pending += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
        const lines = pending.split(/\r?\n/);
        pending = lines.pop();
        for (let index = 0; index < lines.length; index++) {
          if (!lines[index].trim()) continue;
          const record = JSON.parse(lines[index]);
          if (record.type === "result") finalResult = record;
          else handleAnalyzerEvent(record);
        }
        if (chunk.done) break;
      }
      if (pending.trim()) {
        const record = JSON.parse(pending);
        if (record.type === "result") finalResult = record;
        else handleAnalyzerEvent(record);
      }
      if (!finalResult) throw new Error("Analysis stream ended without a final result.");
      return finalResult;
    }

    async function submitAnalysis(event) {
      event.preventDefault();
      if (!document.getElementById("program-file").files.length) {
        showError("Choose a Linux executable or script first.");
        return;
      }
      resetRunView();
      setRunning(true);
      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          body: new FormData(analyzeForm)
        });
        const result = await readAnalysisStream(response);
        renderAnalysis(result);
      } catch (error) {
        showError(error.message);
        liveCard.hidden = true;
      } finally {
        setRunning(false);
      }
    }

    analyzeForm.addEventListener("submit", submitAnalysis);
  </script>
</body>
</html>
